<text x="475" y="390" font-size="11" fill="#898781" text-anchor="middle">milliseconds (labels: hybrid median)</text>
<text x="16" y="412" font-size="11" fill="#898781">One machine (13th Gen Intel(R) Core(TM) i9-13900K, windows x86_64), release build, wall-clock; not cycle-accurate and not a constant-time evaluation. Hybrid</text>
<text x="16" y="426.9" font-size="11" fill="#898781">and components were timed in separate runs: where a component dot lies beyond its hybrid bar, that is run-to-run noise, not a faster hybrid. The HQC port is</text>
<text x="16" y="441.7" font-size="11" fill="#898781">pure Rust without hardware carry-less multiplication.</text>
