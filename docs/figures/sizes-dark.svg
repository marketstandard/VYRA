<text x="120" y="215" font-size="11.5" fill="#c3c2b7" text-anchor="end">VYRA-KEM-1</text>
<rect x="128" y="204" width="11.6" height="14" fill="#3987e5"/>
<path d="M141.6,204 H209.6 Q213.6,204 213.6,208 V214 Q213.6,218 209.6,218 H141.6 Z" fill="#d95926"/>
<text x="220.6" y="215" font-size="11.5" fill="#f0efec">5,201</text>
<text x="120" y="237" font-size="11.5" fill="#c3c2b7" text-anchor="end">VYRA-KEM-3</text>
<rect x="128" y="226" width="16.9" height="14" fill="#3987e5"/>
<path d="M146.9,226 H289.6 Q293.6,226 293.6,230 V236 Q293.6,240 289.6,240 H146.9 Z" fill="#d95926"/>
<text x="300.6" y="237" font-size="11.5" fill="#f0efec">10,066</text>
<text x="120" y="259" font-size="11.5" fill="#c3c2b7" text-anchor="end">VYRA-KEM-5</text>
<rect x="128" y="248" width="24.8" height="14" fill="#3987e5"/>
<path d="M154.8,248 H387 Q391,248 391,252 V258 Q391,262 387,262 H154.8 Z" fill="#d95926"/>
<text x="398" y="259" font-size="11.5" fill="#f0efec">15,989</text>
