<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 541.7" width="880" height="541.7" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img">
<title>What the second component costs in bytes</title>
<rect x="0.5" y="0.5" width="879" height="540.7" rx="10" fill="#1a1a19" stroke="#383835"/>
<text x="20" y="30" font-size="15" fill="#f0efec" font-weight="600">What the second component costs in bytes</text>
<text x="20" y="49" font-size="12" fill="#c3c2b7">Raw encoded sizes; each bar is one object, split into its two components.</text>
<rect x="128" y="68" width="12" height="12" fill="#3987e5" rx="2"/>
<text x="146" y="78.5" font-size="11.5" fill="#c3c2b7">lattice component (ML-KEM or ML-DSA)</text>
<rect x="372.9" y="68" width="12" height="12" fill="#d95926" rx="2"/>
<text x="390.9" y="78.5" font-size="11.5" fill="#c3c2b7">second component (HQC, Ed25519 or SLH-DSA)</text>
<line x1="128" y1="94" x2="128" y2="450" stroke="#52514e" stroke-width="1"/>
<text x="128" y="465" font-size="10.5" fill="#898781" text-anchor="middle">0</text>
<line x1="292.5" y1="94" x2="292.5" y2="450" stroke="#2c2c2a" stroke-width="1"/>
<text x="292.5" y="465" font-size="10.5" fill="#898781" text-anchor="middle">10K</text>
<line x1="457" y1="94" x2="457" y2="450" stroke="#2c2c2a" stroke-width="1"/>
<text x="457" y="465" font-size="10.5" fill="#898781" text-anchor="middle">20K</text>
<line x1="621.5" y1="94" x2="621.5" y2="450" stroke="#2c2c2a" stroke-width="1"/>
<text x="621.5" y="465" font-size="10.5" fill="#898781" text-anchor="middle">30K</text>
<line x1="786" y1="94" x2="786" y2="450" stroke="#2c2c2a" stroke-width="1"/>
<text x="786" y="465" font-size="10.5" fill="#898781" text-anchor="middle">40K</text>
<rect x="16" y="96" width="108" height="16" fill="#1a1a19"/>
