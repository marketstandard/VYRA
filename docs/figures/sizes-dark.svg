<text x="16" y="285" font-size="11" fill="#898781" font-weight="600">Signature, transition suites (ML-DSA + Ed25519)</text>
<text x="120" y="303" font-size="11.5" fill="#c3c2b7" text-anchor="end">VYRA-SIG-2</text>
<rect x="128" y="292" width="38.8" height="14" fill="#3987e5"/>
<rect x="168.8" y="292" width="0.1" height="14" fill="#d95926"/>
<text x="175.9" y="303" font-size="11.5" fill="#f0efec">2,484</text>
<text x="120" y="325" font-size="11.5" fill="#c3c2b7" text-anchor="end">VYRA-SIG-3</text>
<rect x="128" y="314" width="53.4" height="14" fill="#3987e5"/>
<rect x="183.4" y="314" width="0.1" height="14" fill="#d95926"/>
<text x="190.5" y="325" font-size="11.5" fill="#f0efec">3,373</text>
<text x="120" y="347" font-size="11.5" fill="#c3c2b7" text-anchor="end">VYRA-SIG-5</text>
<rect x="128" y="336" width="75.1" height="14" fill="#3987e5"/>
<rect x="205.1" y="336" width="0.1" height="14" fill="#d95926"/>
<text x="212.2" y="347" font-size="11.5" fill="#f0efec">4,691</text>
<rect x="16" y="360" width="108" height="16" fill="#1a1a19"/>
<text x="16" y="373" font-size="11" fill="#898781" font-weight="600">Signature, dual post-quantum suites (ML-DSA + SLH-DSA)</text>
<text x="120" y="391" font-size="11.5" fill="#c3c2b7" text-anchor="end">VYRA-SIG-PQ1</text>
<rect x="128" y="380" width="38.8" height="14" fill="#3987e5"/>
<path d="M168.8,380 H293 Q297,380 297,384 V390 Q297,394 293,394 H168.8 Z" fill="#d95926"/>
<text x="304" y="391" font-size="11.5" fill="#f0efec">10,276</text>
<text x="120" y="413" font-size="11.5" fill="#c3c2b7" text-anchor="end">VYRA-SIG-PQ3</text>
<rect x="128" y="402" width="53.4" height="14" fill="#3987e5"/>
<path d="M183.4,402 H445.3 Q449.3,402 449.3,406 V412 Q449.3,416 445.3,416 H183.4 Z" fill="#d95926"/>
<text x="456.3" y="413" font-size="11.5" fill="#f0efec">19,533</text>
<text x="120" y="435" font-size="11.5" fill="#c3c2b7" text-anchor="end">VYRA-SIG-PQ5</text>
<rect x="128" y="424" width="75.1" height="14" fill="#3987e5"/>
<path d="M205.1,424 H690.2 Q694.2,424 694.2,428 V434 Q694.2,438 690.2,438 H205.1 Z" fill="#d95926"/>
<text x="701.2" y="435" font-size="11.5" fill="#f0efec">34,419</text>
<text x="457" y="484" font-size="11" fill="#898781" text-anchor="middle">bytes (raw encoding; the wire format adds a 7-byte header)</text>
<text x="16" y="506" font-size="11" fill="#898781">HQC accounts for most of every KEM object, and SLH-DSA for most of every dual post-quantum signature. In the transition suites the Ed25519 half is 64 bytes,</text>
<text x="16" y="520.9" font-size="11" fill="#898781">too thin to see at this scale.</text>
</svg>
