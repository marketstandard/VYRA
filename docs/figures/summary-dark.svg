<path d="M384,186 H398.5 Q402.5,186 402.5,190 V196 Q402.5,200 398.5,200 H384 Z" fill="#5c5b57"/>
<text x="409.5" y="197" font-size="11.5" fill="#c3c2b7">16 / 90</text>
<text x="376" y="221" font-size="11.5" fill="#f0efec" text-anchor="end" font-weight="700">VYRA</text>
<path d="M384,210 H386.9 Q390.9,210 390.9,214 V220 Q390.9,224 386.9,224 H384 Z" fill="#3987e5"/>
<text x="397.9" y="221" font-size="11.5" fill="#f0efec" font-weight="700">6 / 90</text>
