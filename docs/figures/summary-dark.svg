<path d="M94,186 H110.8 Q114.8,186 114.8,190 V196 Q114.8,200 110.8,200 H94 Z" fill="#5c5b57"/>
<text x="121.8" y="197" font-size="11.5" fill="#c3c2b7">14 / 70</text>
<text x="86" y="221" font-size="11.5" fill="#f0efec" text-anchor="end" font-weight="700">VYRA</text>
<text x="101" y="221" font-size="11.5" fill="#f0efec" font-weight="700">0 / 70</text>
<text x="306" y="80" font-size="12.5" fill="#f0efec" font-weight="600">Signatures, transition</text>
<text x="306" y="96" font-size="11" fill="#c3c2b7">ML-DSA-44 + Ed25519</text>
