<text x="376" y="125" font-size="11.5" fill="#c3c2b7" text-anchor="end">Concat</text>
<path d="M384,114 H444.7 Q448.7,114 448.7,118 V124 Q448.7,128 444.7,128 H384 Z" fill="#5c5b57"/>
<text x="455.7" y="125" font-size="11.5" fill="#c3c2b7">56 / 90</text>
<text x="376" y="149" font-size="11.5" fill="#c3c2b7" text-anchor="end">ConcatCtx</text>
<path d="M384,138 H421.6 Q425.6,138 425.6,142 V148 Q425.6,152 421.6,152 H384 Z" fill="#5c5b57"/>
<text x="432.6" y="149" font-size="11.5" fill="#c3c2b7">36 / 90</text>
