<text x="666" y="125" font-size="11.5" fill="#c3c2b7" text-anchor="end">Concat</text>
<path d="M674,114 H735 Q739,114 739,118 V124 Q739,128 735,128 H674 Z" fill="#5c5b57"/>
<text x="746" y="125" font-size="11.5" fill="#c3c2b7">20 / 32</text>
<text x="666" y="149" font-size="11.5" fill="#f0efec" text-anchor="end" font-weight="700">VYRA</text>
<path d="M674,138 H676.5 Q680.5,138 680.5,142 V148 Q680.5,152 676.5,152 H674 Z" fill="#3987e5"/>
<text x="687.5" y="149" font-size="11.5" fill="#f0efec" font-weight="700">2 / 32</text>
<rect x="16" y="238" width="12" height="12" fill="#3987e5" rx="2"/>
<text x="34" y="248" font-size="11.5" fill="#c3c2b7">VYRA's design</text>
<rect x="140" y="238" width="12" height="12" fill="#5c5b57" rx="2"/>
<text x="158" y="248" font-size="11.5" fill="#c3c2b7">comparison design</text>
<text x="16" y="270" font-size="11" fill="#898781">VYRA's 6 broken transition squares are 4 strong-unforgeability (SUF-CMA) squares, a gap stated before the run, and 2 where the failed component ignores its</text>
<text x="16" y="284.9" font-size="11" fill="#898781">context. VyraPureEd is VYRA's own earlier signature design, kept as a control. The dual post-quantum pair ran with 12 trials per cell, so its row is weak</text>
<text x="16" y="299.7" font-size="11" fill="#898781">evidence.</text>
