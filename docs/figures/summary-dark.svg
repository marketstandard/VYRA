<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320.6" width="880" height="320.6" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img">
<title>Broken squares when exactly one component has failed</title>
