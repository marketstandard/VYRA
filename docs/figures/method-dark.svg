<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 358.4" width="880" height="358.4" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img">
<title>Failure injection: turning “survives one broken component” into a test</title>
<rect x="0.5" y="0.5" width="879" height="357.4" rx="10" fill="#1a1a19" stroke="#383835"/>
<text x="20" y="30" font-size="15" fill="#f0efec" font-weight="600">Failure injection: turning “survives one broken component” into a test</text>
<text x="20" y="49" font-size="12" fill="#c3c2b7">A real component is replaced by a deliberately broken one, and the composition is attacked in an explicit security game.</text>
<rect x="16" y="68" width="158" height="92" fill="#262624" rx="6" stroke="#383835" stroke-width="1"/>
<text x="95" y="88" font-size="12" fill="#f0efec" text-anchor="middle" font-weight="600">1  Real components</text>
<text x="95" y="105.4" font-size="11" fill="#c3c2b7" text-anchor="middle">ML-KEM-512, HQC-128,</text>
<text x="95" y="120.6" font-size="11" fill="#c3c2b7" text-anchor="middle">ML-DSA-44, Ed25519,</text>
<text x="95" y="135.8" font-size="11" fill="#c3c2b7" text-anchor="middle">SLH-DSA-SHAKE-128s</text>
<rect x="188.5" y="68" width="158" height="92" fill="#262624" rx="6" stroke="#383835" stroke-width="1"/>
<text x="267.5" y="88" font-size="12" fill="#f0efec" text-anchor="middle" font-weight="600">2  Break one property</text>
<text x="267.5" y="105.4" font-size="11" fill="#c3c2b7" text-anchor="middle">5 failure models for KEMs,</text>
<text x="267.5" y="120.6" font-size="11" fill="#c3c2b7" text-anchor="middle">5 for signatures; each</text>
<text x="267.5" y="135.8" font-size="11" fill="#c3c2b7" text-anchor="middle">wraps the real component</text>
<path d="M175,114 L187.5,114" fill="none" stroke="#c3c2b7" stroke-width="1.5" stroke-linejoin="round"/>
<path d="M187.5,114 L179.5,117.6 L179.5,110.4 Z" fill="#c3c2b7"/>
<rect x="361" y="68" width="158" height="92" fill="#262624" rx="6" stroke="#383835" stroke-width="1"/>
<text x="440" y="88" font-size="12" fill="#f0efec" text-anchor="middle" font-weight="600">3  Compose</text>
<text x="440" y="105.4" font-size="11" fill="#c3c2b7" text-anchor="middle">5 KEM combiners and</text>
<text x="440" y="120.6" font-size="11" fill="#c3c2b7" text-anchor="middle">5 signature designs:</text>
<text x="440" y="135.8" font-size="11" fill="#c3c2b7" text-anchor="middle">VYRA plus baselines</text>
<path d="M347.5,114 L360,114" fill="none" stroke="#c3c2b7" stroke-width="1.5" stroke-linejoin="round"/>
<path d="M360,114 L352,117.6 L352,110.4 Z" fill="#c3c2b7"/>
<rect x="533.5" y="68" width="158" height="92" fill="#262624" rx="6" stroke="#383835" stroke-width="1"/>
<text x="612.5" y="88" font-size="12" fill="#f0efec" text-anchor="middle" font-weight="600">4  Attack</text>
<text x="612.5" y="105.4" font-size="11" fill="#c3c2b7" text-anchor="middle">7 KEM and 9 signature</text>
<text x="612.5" y="120.6" font-size="11" fill="#c3c2b7" text-anchor="middle">games; 11 + 15 coded attackers;</text>
<text x="612.5" y="135.8" font-size="11" fill="#c3c2b7" text-anchor="middle">200 seeded trials per cell</text>
<path d="M520,114 L532.5,114" fill="none" stroke="#c3c2b7" stroke-width="1.5" stroke-linejoin="round"/>
<path d="M532.5,114 L524.5,117.6 L524.5,110.4 Z" fill="#c3c2b7"/>
<rect x="706" y="68" width="158" height="92" fill="#262624" rx="6" stroke="#383835" stroke-width="1"/>
<text x="785" y="88" font-size="12" fill="#f0efec" text-anchor="middle" font-weight="600">5  Decide by a fixed rule</text>
<text x="785" y="105.4" font-size="11" fill="#c3c2b7" text-anchor="middle">exact binomial test,</text>
<text x="785" y="120.6" font-size="11" fill="#c3c2b7" text-anchor="middle">p below 0.000001: BROKEN,</text>
<text x="785" y="135.8" font-size="11" fill="#c3c2b7" text-anchor="middle">else NO ATTACK FOUND</text>
<path d="M692.5,114 L705,114" fill="none" stroke="#c3c2b7" stroke-width="1.5" stroke-linejoin="round"/>
<path d="M705,114 L697,117.6 L697,110.4 Z" fill="#c3c2b7"/>
<text x="16" y="188" font-size="12" fill="#f0efec" font-weight="600">What keeps the test honest</text>
<text x="28" y="240" font-size="11" fill="#c3c2b7">Named insecure baselines (plain concatenation,</text>
<text x="28" y="254.8" font-size="11" fill="#c3c2b7">XOR) and patterns with both components broken.</text>
<text x="28" y="269.7" font-size="11" fill="#c3c2b7">If these did not break, the harness would be</text>
<text x="28" y="284.6" font-size="11" fill="#c3c2b7">blind.</text>
<text x="315.3" y="240" font-size="11" fill="#c3c2b7">A coin-flipping distinguisher and a garbage</text>
<text x="315.3" y="254.8" font-size="11" fill="#c3c2b7">forger, and every attacker against two real</text>
<text x="315.3" y="269.7" font-size="11" fill="#c3c2b7">components (except XOR, which theory says is</text>
<text x="315.3" y="284.6" font-size="11" fill="#c3c2b7">broken).</text>
<text x="602.7" y="240" font-size="11" fill="#c3c2b7">759 of 3,365 cells carry a verdict predicted</text>
<text x="602.7" y="254.8" font-size="11" fill="#c3c2b7">from a documented claim, control or theorem. 0</text>
<text x="602.7" y="269.7" font-size="11" fill="#c3c2b7">contradicted it. The rest are observations.</text>
<rect x="16" y="200" width="273.3" height="99.4" fill="none" rx="6" stroke="#383835" stroke-width="1"/>
<text x="28" y="221" font-size="12" fill="#f0efec" font-weight="600">Designs that must break</text>
<rect x="303.3" y="200" width="273.3" height="99.4" fill="none" rx="6" stroke="#383835" stroke-width="1"/>
<text x="315.3" y="221" font-size="12" fill="#f0efec" font-weight="600">Attackers that must lose</text>
<rect x="590.7" y="200" width="273.3" height="99.4" fill="none" rx="6" stroke="#383835" stroke-width="1"/>
<text x="602.7" y="221" font-size="12" fill="#f0efec" font-weight="600">Expectations written first</text>
<text x="16" y="321.4" font-size="11.5" fill="#c3c2b7">A verdict of NO ATTACK FOUND means only that the coded attackers did not win against an idealised failure. It is evidence that can refute a design,</text>
<text x="16" y="336.9" font-size="11.5" fill="#c3c2b7">not a proof that the design is secure.</text>
</svg>
