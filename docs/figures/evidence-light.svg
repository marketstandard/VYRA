<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 434.7" width="880" height="434.7" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img">
<title>What “Verified” means here, layer by layer</title>
<rect x="0.5" y="0.5" width="879" height="433.7" rx="10" fill="#fcfcfb" stroke="#e1e0d9"/>
<text x="20" y="30" font-size="15" fill="#0b0b0b" font-weight="600">What “Verified” means here, layer by layer</text>
<text x="20" y="49" font-size="12" fill="#52514e">Every claim is tied to a check a machine can rerun. The right-hand column is what those checks do not show.</text>
<text x="28" y="80" font-size="10.5" fill="#898781" font-weight="700">LAYER</text>
<text x="196" y="80" font-size="10.5" fill="#898781" font-weight="700">CHECKED BY</text>
<text x="560" y="80" font-size="10.5" fill="#898781" font-weight="700">NOT SHOWN</text>
<line x1="16" y1="90" x2="864" y2="90" stroke="#e1e0d9" stroke-width="1"/>
<text x="28" y="112" font-size="12.5" fill="#0b0b0b" font-weight="600">Components</text>
<text x="28" y="129.9" font-size="11" fill="#52514e">ML-KEM, HQC, ML-DSA,</text>
<text x="28" y="144.7" font-size="11" fill="#52514e">SLH-DSA, Ed25519</text>
<text x="196" y="112" font-size="11.5" fill="#0b0b0b">Official test vectors: the HQC v5.1 known-answer tests,</text>
<text x="196" y="127.5" font-size="11.5" fill="#0b0b0b">NIST ACVP vectors for ML-DSA and SLH-DSA, RFC 8032 vectors</text>
<text x="196" y="143.1" font-size="11.5" fill="#0b0b0b">for Ed25519; cross-checks against independent crates.</text>
<text x="560" y="112" font-size="11.5" fill="#52514e">That the components are secure or run in constant</text>
<text x="560" y="127.5" font-size="11.5" fill="#52514e">time. No independent HQC v5.1 implementation exists</text>
<text x="560" y="143.1" font-size="11.5" fill="#52514e">to compare against.</text>
<rect x="16" y="98" width="3" height="53.6" fill="#2a78d6" rx="1.5"/>
<line x1="16" y1="161.6" x2="864" y2="161.6" stroke="#e1e0d9" stroke-width="1"/>
<text x="28" y="183.6" font-size="12.5" fill="#0b0b0b" font-weight="600">Compositions</text>
<text x="28" y="201.4" font-size="11" fill="#52514e">KEM combiner, composite</text>
<text x="28" y="216.3" font-size="11" fill="#52514e">signature</text>
<text x="196" y="183.6" font-size="11.5" fill="#0b0b0b">Failure injection: 3,365 cells of explicit security games</text>
<text x="196" y="199.1" font-size="11.5" fill="#0b0b0b">against deliberately broken components, with positive and</text>
<text x="196" y="214.6" font-size="11.5" fill="#0b0b0b">negative controls.</text>
<text x="560" y="183.6" font-size="11.5" fill="#52514e">A security proof. Only the coded attacks were tried,</text>
<text x="560" y="199.1" font-size="11.5" fill="#52514e">against idealised failures.</text>
<rect x="16" y="169.6" width="3" height="53.6" fill="#2a78d6" rx="1.5"/>
<line x1="16" y1="233.1" x2="864" y2="233.1" stroke="#e1e0d9" stroke-width="1"/>
<text x="28" y="255.1" font-size="12.5" fill="#0b0b0b" font-weight="600">Encodings</text>
<text x="28" y="273" font-size="11" fill="#52514e">wire header, transcript</text>
<text x="28" y="287.9" font-size="11" fill="#52514e">framing, message</text>
<text x="28" y="302.7" font-size="11" fill="#52514e">representative</text>
<text x="196" y="255.1" font-size="11.5" fill="#0b0b0b">Bounded model checking with Kani: 413 proof harnesses pass</text>
<text x="196" y="270.7" font-size="11.5" fill="#0b0b0b">and 12 of 12 injected bugs are caught; exhaustive</text>
<text x="196" y="286.2" font-size="11.5" fill="#0b0b0b">enumeration of small domains.</text>
<text x="560" y="255.1" font-size="11.5" fill="#52514e">Anything outside VYRA's own encoding code, or beyond</text>
<text x="560" y="270.7" font-size="11.5" fill="#52514e">the stated bounds.</text>
<rect x="16" y="241.1" width="3" height="68.4" fill="#2a78d6" rx="1.5"/>
<line x1="16" y1="319.6" x2="864" y2="319.6" stroke="#e1e0d9" stroke-width="1"/>
<text x="28" y="341.6" font-size="12.5" fill="#0b0b0b" font-weight="600">Repository</text>
<text x="28" y="359.5" font-size="11" fill="#52514e">build, tests, documentation</text>
<text x="28" y="374.3" font-size="11" fill="#52514e">claims</text>
<text x="196" y="341.6" font-size="11.5" fill="#0b0b0b">37 machine-evaluated gates, all passing, run by one</text>
<text x="196" y="357.1" font-size="11.5" fill="#0b0b0b">command (cargo xtask verify).</text>
<text x="560" y="341.6" font-size="11.5" fill="#52514e">Security. The gates show functional correctness and</text>
<text x="560" y="357.1" font-size="11.5" fill="#52514e">hygiene. There has been no external review.</text>
<rect x="16" y="327.6" width="3" height="53.6" fill="#2a78d6" rx="1.5"/>
<line x1="16" y1="391.2" x2="864" y2="391.2" stroke="#e1e0d9" stroke-width="1"/>
<text x="16" y="413.2" font-size="11.5" fill="#898781">None of this is formal verification of the cryptography, and none of it replaces review by people outside the project.</text>
</svg>
