<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 373.7" width="880" height="373.7" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img">
<title>Signature speed: the price of two post-quantum assumptions</title>
<rect x="0.5" y="0.5" width="879" height="372.7" rx="10" fill="#1a1a19" stroke="#383835"/>
<text x="20" y="30" font-size="15" fill="#f0efec" font-weight="600">Signature speed: the price of two post-quantum assumptions</text>
<text x="20" y="49" font-size="12" fill="#c3c2b7">Median wall-clock time on a 1 KiB message. Logarithmic axis: each gridline is ten times the previous one.</text>
<circle cx="134" cy="74" r="5" fill="#199e70"/>
<text x="146" y="78.5" font-size="11.5" fill="#c3c2b7">key generation</text>
<circle cx="254.9" cy="74" r="5" fill="#3987e5"/>
<text x="266.9" y="78.5" font-size="11.5" fill="#c3c2b7">sign</text>
<circle cx="319.4" cy="74" r="5" fill="#d95926"/>
<text x="331.4" y="78.5" font-size="11.5" fill="#c3c2b7">verify</text>
<line x1="128" y1="96" x2="128" y2="282" stroke="#2c2c2a" stroke-width="1"/>
<text x="128" y="297" font-size="10.5" fill="#898781" text-anchor="middle">0.1 ms</text>
<line x1="262.4" y1="96" x2="262.4" y2="282" stroke="#2c2c2a" stroke-width="1"/>
<text x="262.4" y="297" font-size="10.5" fill="#898781" text-anchor="middle">1 ms</text>
<line x1="396.8" y1="96" x2="396.8" y2="282" stroke="#2c2c2a" stroke-width="1"/>
<text x="396.8" y="297" font-size="10.5" fill="#898781" text-anchor="middle">10 ms</text>
<line x1="531.2" y1="96" x2="531.2" y2="282" stroke="#2c2c2a" stroke-width="1"/>
<text x="531.2" y="297" font-size="10.5" fill="#898781" text-anchor="middle">100 ms</text>
<line x1="665.6" y1="96" x2="665.6" y2="282" stroke="#2c2c2a" stroke-width="1"/>
<text x="665.6" y="297" font-size="10.5" fill="#898781" text-anchor="middle">1 s</text>
<line x1="800" y1="96" x2="800" y2="282" stroke="#2c2c2a" stroke-width="1"/>
<text x="800" y="297" font-size="10.5" fill="#898781" text-anchor="middle">10 s</text>
<rect x="16" y="98" width="164.3" height="14" fill="#1a1a19"/>
<text x="16" y="110" font-size="11" fill="#898781" font-weight="600">Transition (ML-DSA + Ed25519)</text>
<text x="120" y="128" font-size="11.5" fill="#c3c2b7" text-anchor="end">VYRA-SIG-2</text>
<line x1="128" y1="124" x2="800" y2="124" stroke="#2c2c2a" stroke-width="1"/>
<circle cx="180.6" cy="124" r="5" fill="#199e70" stroke="#1a1a19" stroke-width="2"/>
<circle cx="263.3" cy="124" r="5" fill="#3987e5" stroke="#1a1a19" stroke-width="2"/>
<circle cx="166.2" cy="124" r="5" fill="#d95926" stroke="#1a1a19" stroke-width="2"/>
<text x="274.3" y="128" font-size="11.5" fill="#f0efec">1.01 ms</text>
<text x="120" y="152" font-size="11.5" fill="#c3c2b7" text-anchor="end">VYRA-SIG-3</text>
<line x1="128" y1="148" x2="800" y2="148" stroke="#2c2c2a" stroke-width="1"/>
<circle cx="177.9" cy="148" r="5" fill="#199e70" stroke="#1a1a19" stroke-width="2"/>
<circle cx="267.6" cy="148" r="5" fill="#3987e5" stroke="#1a1a19" stroke-width="2"/>
<circle cx="182.4" cy="148" r="5" fill="#d95926" stroke="#1a1a19" stroke-width="2"/>
<text x="278.6" y="152" font-size="11.5" fill="#f0efec">1.09 ms</text>
<text x="120" y="176" font-size="11.5" fill="#c3c2b7" text-anchor="end">VYRA-SIG-5</text>
<line x1="128" y1="172" x2="800" y2="172" stroke="#2c2c2a" stroke-width="1"/>
<circle cx="199.8" cy="172" r="5" fill="#199e70" stroke="#1a1a19" stroke-width="2"/>
<circle cx="284.8" cy="172" r="5" fill="#3987e5" stroke="#1a1a19" stroke-width="2"/>
<circle cx="222" cy="172" r="5" fill="#d95926" stroke="#1a1a19" stroke-width="2"/>
<text x="295.8" y="176" font-size="11.5" fill="#f0efec">1.47 ms</text>
<rect x="16" y="190" width="202" height="14" fill="#1a1a19"/>
<text x="16" y="202" font-size="11" fill="#898781" font-weight="600">Dual post-quantum (ML-DSA + SLH-DSA)</text>
<text x="120" y="220" font-size="11.5" fill="#c3c2b7" text-anchor="end">VYRA-SIG-PQ1</text>
<line x1="128" y1="216" x2="800" y2="216" stroke="#2c2c2a" stroke-width="1"/>
<circle cx="550" cy="216" r="5" fill="#199e70" stroke="#1a1a19" stroke-width="2"/>
<circle cx="682.1" cy="216" r="5" fill="#3987e5" stroke="#1a1a19" stroke-width="2"/>
<circle cx="271.8" cy="216" r="5" fill="#d95926" stroke="#1a1a19" stroke-width="2"/>
<text x="693.1" y="220" font-size="11.5" fill="#f0efec">1.33 s</text>
<text x="120" y="244" font-size="11.5" fill="#c3c2b7" text-anchor="end">VYRA-SIG-PQ3</text>
<line x1="128" y1="240" x2="800" y2="240" stroke="#2c2c2a" stroke-width="1"/>
<circle cx="570.4" cy="240" r="5" fill="#199e70" stroke="#1a1a19" stroke-width="2"/>
<circle cx="716" cy="240" r="5" fill="#3987e5" stroke="#1a1a19" stroke-width="2"/>
<circle cx="288.6" cy="240" r="5" fill="#d95926" stroke="#1a1a19" stroke-width="2"/>
<text x="727" y="244" font-size="11.5" fill="#f0efec">2.37 s</text>
<text x="120" y="268" font-size="11.5" fill="#c3c2b7" text-anchor="end">VYRA-SIG-PQ5</text>
<line x1="128" y1="264" x2="800" y2="264" stroke="#2c2c2a" stroke-width="1"/>
<circle cx="548.6" cy="264" r="5" fill="#199e70" stroke="#1a1a19" stroke-width="2"/>
<circle cx="700.7" cy="264" r="5" fill="#3987e5" stroke="#1a1a19" stroke-width="2"/>
<circle cx="313.7" cy="264" r="5" fill="#d95926" stroke="#1a1a19" stroke-width="2"/>
<text x="711.7" y="268" font-size="11.5" fill="#f0efec">1.83 s</text>
<text x="464" y="316" font-size="11" fill="#898781" text-anchor="middle">time per operation (labels: signing median)</text>
<text x="16" y="338" font-size="11" fill="#898781">Same machine and caveats as the KEM timings. n = 200, except dual post-quantum key generation (n = 20) and signing (n = 10). Dual post-quantum signing takes</text>
<text x="16" y="352.9" font-size="11" fill="#898781">seconds because SLH-DSA signing does; verification stays in milliseconds. These suites fit low-rate, long-lived signatures such as releases and archives.</text>
</svg>
