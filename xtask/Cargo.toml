[package]
name = "xtask"
description = "VYRA verification tooling: known-answer vectors, sizes, benchmarks, gate runner"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false

[dependencies]
# VYRA crates under test (path dependencies; deliberately not the `vyra` facade).
vyra-core = { path = "../crates/vyra-core" }
vyra-kem = { path = "../crates/vyra-kem" }
vyra-sig = { path = "../crates/vyra-sig" }
vyra-seal = { path = "../crates/vyra-seal" }
# Digests for vectors (SHA3-256) and the research-report pin X1 (SHA-256).
sha3.workspace = true
sha2 = "0.11.0"
# Reading JSON back (vectors --check, gate validation). Writing uses xtask's
# own canonical emitter (sorted keys, LF, trailing newline).
serde_json = "1.0.154"

[lints]
workspace = true
