<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 414" width="880" height="414" font-family="'Libertinus Serif', serif" role="img">
<title>How VYRA combines two independent components</title>
<text x="20" y="20" font-size="13" fill="#000000" font-weight="700">a</text>
<text x="36" y="20" font-size="13" fill="#000000" font-weight="600">Hybrid key encapsulation (VYRA-KEM)</text>
<rect x="20" y="56" width="150" height="108" fill="#f2f2f2" rx="6" stroke="#999999" stroke-width="1"/>
<text x="95" y="76" font-size="12" fill="#000000" text-anchor="middle" font-weight="600">Recipient public key</text>
<text x="95" y="93.4" font-size="11" fill="#333333" text-anchor="middle">pk1 for ML-KEM</text>
<text x="95" y="108.6" font-size="11" fill="#333333" text-anchor="middle">pk2 for HQC</text>
<rect x="232" y="36" width="196" height="62" fill="#f2f2f2" rx="6" stroke="#999999" stroke-width="1"/>
<text x="330" y="56" font-size="12" fill="#000000" text-anchor="middle" font-weight="600">ML-KEM encapsulate</text>
<text x="330" y="73.4" font-size="11" fill="#333333" text-anchor="middle">module lattices · FIPS 203</text>
<rect x="232" y="122" width="196" height="62" fill="#f2f2f2" rx="6" stroke="#999999" stroke-width="1"/>
<text x="330" y="142" font-size="12" fill="#000000" text-anchor="middle" font-weight="600">HQC encapsulate</text>
<text x="330" y="159.4" font-size="11" fill="#333333" text-anchor="middle">error-correcting codes · v5.1</text>
<path d="M170,91 L201,91 L201,67 L232,67" fill="none" stroke="#333333" stroke-width="1.5" stroke-linejoin="round"/>
<path d="M232,67 L224,70.6 L224,63.4 Z" fill="#333333"/>
<path d="M170,129 L201,129 L201,153 L232,153" fill="none" stroke="#333333" stroke-width="1.5" stroke-linejoin="round"/>
<path d="M232,153 L224,156.6 L224,149.4 Z" fill="#333333"/>
<rect x="520" y="36" width="232" height="148" fill="#f2f2f2" rx="6" stroke="#2a78d6" stroke-width="1.5"/>
<text x="636" y="57" font-size="12" fill="#000000" text-anchor="middle" font-weight="600">Combiner: one SHA3-256 hash</text>
<text x="636" y="74" font-size="10.5" fill="#333333" text-anchor="middle">over everything, each field length-prefixed</text>
<rect x="534" y="86" width="41.5" height="20" fill="#ffffff" rx="10" stroke="#999999" stroke-width="1"/>
<text x="554.8" y="100" font-size="11" fill="#000000" text-anchor="middle">label</text>
<rect x="580.5" y="86" width="58" height="20" fill="#ffffff" rx="10" stroke="#999999" stroke-width="1"/>
<text x="609.5" y="100" font-size="11" fill="#000000" text-anchor="middle">suite id</text>
<rect x="643.5" y="86" width="25" height="20" fill="#ffffff" rx="10" stroke="#999999" stroke-width="1"/>
<text x="656" y="100" font-size="11" fill="#000000" text-anchor="middle">k1</text>
<rect x="673.5" y="86" width="25" height="20" fill="#ffffff" rx="10" stroke="#999999" stroke-width="1"/>
<text x="686" y="100" font-size="11" fill="#000000" text-anchor="middle">k2</text>
<rect x="703.5" y="86" width="25" height="20" fill="#ffffff" rx="10" stroke="#999999" stroke-width="1"/>
<text x="716" y="100" font-size="11" fill="#000000" text-anchor="middle">c1</text>
<rect x="534" y="111" width="25" height="20" fill="#ffffff" rx="10" stroke="#999999" stroke-width="1"/>
<text x="546.5" y="125" font-size="11" fill="#000000" text-anchor="middle">c2</text>
<rect x="564" y="111" width="30.5" height="20" fill="#ffffff" rx="10" stroke="#999999" stroke-width="1"/>
<text x="579.2" y="125" font-size="11" fill="#000000" text-anchor="middle">pk1</text>
<rect x="599.5" y="111" width="30.5" height="20" fill="#ffffff" rx="10" stroke="#999999" stroke-width="1"/>
<text x="614.8" y="125" font-size="11" fill="#000000" text-anchor="middle">pk2</text>
<path d="M428,67 L520,67" fill="none" stroke="#333333" stroke-width="1.5" stroke-linejoin="round"/>
<path d="M520,67 L512,70.6 L512,63.4 Z" fill="#333333"/>
<path d="M428,153 L520,153" fill="none" stroke="#333333" stroke-width="1.5" stroke-linejoin="round"/>
<path d="M520,153 L512,156.6 L512,149.4 Z" fill="#333333"/>
<text x="474" y="60" font-size="10.5" fill="#333333" text-anchor="middle">key k1, ct c1</text>
<text x="474" y="146" font-size="10.5" fill="#333333" text-anchor="middle">key k2, ct c2</text>
<path d="M95,164 L95,208 L636,208 L636,184" fill="none" stroke="#333333" stroke-width="1.5" stroke-linejoin="round"/>
<path d="M636,184 L639.6,192 L632.4,192 Z" fill="#333333"/>
<text x="300" y="202" font-size="10.5" fill="#333333" text-anchor="middle">the public keys are hashed as well</text>
<path d="M752,110 L790,110" fill="none" stroke="#333333" stroke-width="1.5" stroke-linejoin="round"/>
<path d="M790,110 L782,113.6 L782,106.4 Z" fill="#333333"/>
<rect x="790" y="82" width="70" height="56" fill="#f2f2f2" rx="6" stroke="#999999" stroke-width="1"/>
<text x="825" y="103" font-size="13" fill="#000000" text-anchor="middle" font-weight="600">K</text>
<text x="825" y="121.8" font-size="12" fill="#333333" text-anchor="middle">32 bytes</text>
<line x1="20" y1="230" x2="860" y2="230" stroke="#dddddd" stroke-width="1"/>
<text x="20" y="256" font-size="13" fill="#000000" font-weight="700">b</text>
<text x="36" y="256" font-size="13" fill="#000000" font-weight="600">Composite signature (VYRA-SIG)</text>
<rect x="20" y="300" width="130" height="62" fill="#f2f2f2" rx="6" stroke="#999999" stroke-width="1"/>
<text x="85" y="320" font-size="12" fill="#000000" text-anchor="middle" font-weight="600">Message M</text>
<text x="85" y="337.4" font-size="11" fill="#333333" text-anchor="middle">context string ctx</text>
<rect x="196" y="272" width="268" height="118" fill="#f2f2f2" rx="6" stroke="#2a78d6" stroke-width="1.5"/>
<text x="330" y="293" font-size="12" fill="#000000" text-anchor="middle" font-weight="600">Message representative M′</text>
<text x="330" y="310" font-size="10.5" fill="#333333" text-anchor="middle">what both halves actually sign</text>
<rect x="210" y="322" width="41.5" height="20" fill="#ffffff" rx="10" stroke="#999999" stroke-width="1"/>
<text x="230.8" y="336" font-size="11" fill="#000000" text-anchor="middle">label</text>
<rect x="256.5" y="322" width="58" height="20" fill="#ffffff" rx="10" stroke="#999999" stroke-width="1"/>
<text x="285.5" y="336" font-size="11" fill="#000000" text-anchor="middle">suite id</text>
<rect x="210" y="347" width="146" height="20" fill="#ffffff" rx="10" stroke="#999999" stroke-width="1"/>
<text x="283" y="361" font-size="11" fill="#000000" text-anchor="middle">hash of both public keys</text>
<rect x="361" y="347" width="69" height="20" fill="#ffffff" rx="10" stroke="#999999" stroke-width="1"/>
<text x="395.5" y="361" font-size="11" fill="#000000" text-anchor="middle">ctx length</text>
<rect x="210" y="372" width="30.5" height="20" fill="#ffffff" rx="10" stroke="#999999" stroke-width="1"/>
<text x="225.2" y="386" font-size="11" fill="#000000" text-anchor="middle">ctx</text>
<rect x="245.5" y="372" width="19.5" height="20" fill="#ffffff" rx="10" stroke="#999999" stroke-width="1"/>
<text x="255.2" y="386" font-size="11" fill="#000000" text-anchor="middle">M</text>
<path d="M150,331 L196,331" fill="none" stroke="#333333" stroke-width="1.5" stroke-linejoin="round"/>
<path d="M196,331 L188,334.6 L188,327.4 Z" fill="#333333"/>
<rect x="510" y="266" width="212" height="58" fill="#f2f2f2" rx="6" stroke="#999999" stroke-width="1"/>
<text x="616" y="286" font-size="12" fill="#000000" text-anchor="middle" font-weight="600">ML-DSA sign</text>
<text x="616" y="303.4" font-size="11" fill="#333333" text-anchor="middle">module lattices · FIPS 204</text>
<rect x="510" y="342" width="212" height="58" fill="#f2f2f2" rx="6" stroke="#999999" stroke-width="1"/>
<text x="616" y="362" font-size="12" fill="#000000" text-anchor="middle" font-weight="600">Second half sign</text>
<text x="616" y="379.4" font-size="11" fill="#333333" text-anchor="middle">Ed25519ph, or SLH-DSA (hash-based)</text>
<path d="M464,317 L487,317 L487,295 L510,295" fill="none" stroke="#333333" stroke-width="1.5" stroke-linejoin="round"/>
<path d="M510,295 L502,298.6 L502,291.4 Z" fill="#333333"/>
<path d="M464,345 L487,345 L487,371 L510,371" fill="none" stroke="#333333" stroke-width="1.5" stroke-linejoin="round"/>
<path d="M510,371 L502,374.6 L502,367.4 Z" fill="#333333"/>
<rect x="768" y="300" width="92" height="62" fill="#f2f2f2" rx="6" stroke="#999999" stroke-width="1"/>
<text x="814" y="320" font-size="12" fill="#000000" text-anchor="middle" font-weight="600">s1 ‖ s2</text>
<text x="814" y="337.4" font-size="11" fill="#333333" text-anchor="middle">valid only if</text>
<text x="814" y="352.6" font-size="11" fill="#333333" text-anchor="middle">both verify</text>
<path d="M722,295 L745,295 L745,320 L768,320" fill="none" stroke="#333333" stroke-width="1.5" stroke-linejoin="round"/>
<path d="M768,320 L760,323.6 L760,316.4 Z" fill="#333333"/>
<path d="M722,371 L745,371 L745,344 L768,344" fill="none" stroke="#333333" stroke-width="1.5" stroke-linejoin="round"/>
<path d="M768,344 L760,347.6 L760,340.4 Z" fill="#333333"/>
</svg>
