name: CI

# The fast check: formatting, lints and the whole test suite, on one runner.
# It takes a few minutes and runs on every pull request and every push to main.
#
# It runs on macOS because the arm64 runners finish the test suite in about
# five minutes; the same suite takes about 45 minutes on the x86-64 Linux
# runners (the tests are dominated by SHA-3 and SLH-DSA).
#
# The full gate run (`cargo xtask verify`) and the other platforms are in
# full-verify.yml, which runs weekly and on demand, not on every push.

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch or pull request replaces the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: fmt, clippy, test
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked
